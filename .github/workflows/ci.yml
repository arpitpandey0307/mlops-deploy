name: Iris ML API - CI Pipeline -CSE

#define when github should run this workflow
on:
#run CI whenever there is a push or pull request to the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


#permission are restricted to read-only for security reasons
permissions:
  contents: read 
  packages: write

#Define jobs that make up the pipeline 
jobs:
  test:
    name: Run API Tests
  #github repo provides a virtual machine to run the job
    runs-on: ubuntu-latest
    steps:
      #Step 1: Download the code from github repo to the virtual machine
      - name: Checkout code repository
        uses: actions/checkout@v4

      #Step 2: Install python on runner
      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      #Step 3: Install Python dependencies from requirements.txt file
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #run tests using pytest framework
      - name: Run Automated tests
        run: |
          python -m pytest -v

    

  #Step 4: Build docker image for the iris ml api
  build-and-publish:
    name: Build and Publish Docker image
    #this job will only run if the previous job is successful
    needs: test
    runs-on: ubuntu-latest

    #Publish only when code is pushed to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      #Download the source code
      - name: Checkout code repository
        uses: actions/checkout@v4

      #Enable docker buildkit Fuctionality for faster builds
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3

      #Authenticate with GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #Generate images names and tags
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw, value=latest
            type=sha, format=short

      #Build and push Docker image to push it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}